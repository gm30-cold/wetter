name: Wetterfusion
options:
  bundleIdPrefix: com.patrick.wetterfusion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Wetterfusion braucht deinen Standort, um die genauesten lokalen Vorhersagen zu fusionieren."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

targets:
  Wetterfusion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wetterfusion/Sources
      - path: Wetterfusion/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrick.wetterfusion
        TARGETED_DEVICE_FAMILY: "1,2"
